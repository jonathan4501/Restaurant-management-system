[project]
name = "renzy-backend"
version = "0.1.0"
description = "RENZY restaurant order and sales system — Django backend"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16",
    "drf-spectacular>=0.28",
    "django-cors-headers>=4.6",
    "django-otp>=1.5",
    "psycopg[binary]>=3.2",
    "dj-database-url>=2.3",
    "redis>=5.2",
    "celery>=5.4",
    "argon2-cffi>=23.1",
    "PyJWT>=2.10",
    "uuid6>=2024.7.10",
    "uvicorn[standard]>=0.34",
    "sentry-sdk[django,celery]>=2.20",
    "pillow>=11",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "hypothesis>=6.120",
    "factory-boy>=3.3",
    "ruff>=0.9",
    "black>=25.1",
    "mypy>=1.14",
    "django-stubs[compatible-mypy]>=5.1",
    "djangorestframework-stubs>=3.15",
]

[tool.uv]
package = false

# ---------------------------------------------------------------- formatting / linting
[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "migrations"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "T20"]
ignore = ["E501", "DJ001"]  # DJ001: nullable text columns mirror the SQL in docs/03 (void_reason, reason_code)

[tool.ruff.lint.per-file-ignores]
"apps/*/management/commands/*.py" = ["T20"]
"config/settings/*.py" = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

# ---------------------------------------------------------------- typing
[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = ["migrations/", "/tests/", "conftest.py"]

[[tool.mypy.overrides]]
# Money and state transitions are type-checked strictly. Add modules here, never remove.
module = [
    "apps.core.money",
    "apps.core.business_date",
    "apps.core.commands",
    "apps.core.idempotency",
    "apps.orders.state_machine",
    "apps.orders.events",
    "apps.orders.totals",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
warn_return_any = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["uuid6", "dj_database_url", "argon2.*", "celery.*", "factory.*", "django_otp.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ---------------------------------------------------------------- tests
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["apps", "tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:apps.*"]
