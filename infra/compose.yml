# Production stack on one VPS. Postgres is a managed instance (DATABASE_URL); there is no db service here.
# Images are built by CI and tagged by git SHA (see .github/workflows/deploy.yml).
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - static:/srv/static:ro
      - media:/srv/media:ro
    environment:
      API_DOMAIN: ${API_DOMAIN}
    depends_on: [api]

  api:
    image: ${IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    volumes:
      - static:/app/staticfiles
      - media:/app/mediafiles
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      redis: { condition: service_healthy }

  worker:
    image: ${IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    command: uv run --no-dev celery -A config worker -l info --concurrency 2
    depends_on:
      redis: { condition: service_healthy }

  beat:
    image: ${IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    command: uv run --no-dev celery -A config beat -l info
    depends_on:
      redis: { condition: service_healthy }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  caddy_data:
  caddy_config:
  redisdata:
  static:
  media:
