# Deploy skeleton (WS13 completes it): build the backend image, push to GHCR, pull + migrate on the VPS.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency: deploy-production

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.IMAGE }}
          build-args: GIT_SHA=${{ github.sha }}
      - name: Pull, migrate, restart on the VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/renzy
            echo "IMAGE=${{ env.IMAGE }}" > .image.env
            export IMAGE=${{ env.IMAGE }}
            docker compose -f infra/compose.yml pull api worker beat
            docker compose -f infra/compose.yml run --rm api uv run --no-dev python manage.py migrate --noinput
            docker compose -f infra/compose.yml up -d
            sleep 5
            curl -fsS http://localhost:8000/readyz || (docker compose -f infra/compose.yml logs --tail 100 api; exit 1)
