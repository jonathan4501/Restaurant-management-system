name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: renzy
          POSTGRES_PASSWORD: renzy
          POSTGRES_DB: renzy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U renzy" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://renzy:renzy@localhost:5432/renzy
      REDIS_URL: redis://localhost:6379/1
      SECRET_KEY: ci-only
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run black --check .
      - name: Type-check
        run: uv run mypy apps config
      - name: Migrations are committed
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Tests
        run: uv run pytest
      - name: OpenAPI drift
        run: |
          uv run python manage.py spectacular --file openapi.json --validate
          git diff --exit-code -- openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated types match openapi.json
        run: |
          npx openapi-typescript ../backend/openapi.json -o lib/api/schema.d.ts
          git diff --exit-code -- lib/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
