[project]
name = "renzy-bridge"
version = "0.1.0"
description = "RENZY print bridge — Raspberry Pi daemon that prints kitchen tickets and receipts over ESC/POS"
requires-python = ">=3.12"
dependencies = [
    # The only runtime dependency: HTTP/1.1 with streaming response bodies, for SSE.
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "black>=25.1",
]

[project.optional-dependencies]
# Installed on the Pi in production; the daemon runs without it.
sentry = ["sentry-sdk>=2.20"]

[project.scripts]
renzy-bridge = "renzy_bridge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["renzy_bridge"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# --selftest reports to the operator on stdout; that is its whole job.
"renzy_bridge/__main__.py" = ["T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
